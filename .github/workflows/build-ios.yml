name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: |
          npm install @capacitor/ios
          npx cap add ios
          npx cap sync ios

      - name: Compile Native iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build

      - name: Package into IPA
        run: |
          mkdir -p ios/App/build/Payload
          mv ios/App/build/Release-iphoneos/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r openGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-ios-ipa
          path: ios/App/build/openGym.ipa

